<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mohra - play chess in your browser</title>
    <meta
      name="description"
      content="Play chess in your browser against the computer at three levels, or a friend on the same device. Free, no signup, no install."
    />
    <meta name="theme-color" content="#2F4F3E" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mohra" />
    <meta property="og:title" content="Mohra - play chess in your browser" />
    <meta
      property="og:description"
      content="Play chess in your browser against the computer at three levels, or a friend on the same device. Free, no signup, no install."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mohra - play chess in your browser" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mohra - play chess in your browser" />
    <meta
      name="twitter:description"
      content="Play chess in your browser against the computer at three levels, or a friend on the same device. Free, no signup, no install."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      const umamiId = import.meta.env.VITE_UMAMI_ID;
      if (umamiId) {
        const script = document.createElement('script');
        script.defer = true;
        script.src = 'https://cloud.umami.is/script.js';
        script.setAttribute('data-website-id', umamiId);
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
